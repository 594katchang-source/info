<body class="independent-tool paper-radar-site">
  <header class="site-header">
    <a class="brand" href="../../"><img src="../../assets/profile/kat-avatar.jpg" alt="Kat Chang 凱特營養師"><span>Kat Chang</span></a>
    <nav aria-label="主要導覽">

      <a href="https://zcal.co/katchang" target="_blank" rel="noopener">聯絡</a>
    </nav>
  </header>

  <main class="paper-radar-page">
    <section class="paper-hero" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">PUBLIC PAPER RADAR</p>
        <h1 id="page-title">論文讀書小站</h1>
        <p class="lead">保留論文原文的英文題名、作者與摘要，將完成後的閱讀筆記與複習內容放在下方，以繁體中文呈現。</p>
        <p class="paper-hero-note">公開頁只放核准的論文欄位與成果，不連接私人網站，不提供排程、上傳或寫入功能。</p>
      </div>
      <aside class="paper-hero-panel" aria-label="資料說明">
        <span class="panel-label">公開資料</span>
        <strong id="updated-at">讀取中</strong>
        <span>由完成成果的公開白名單產生</span>
      </aside>
    </section>

    <section class="paper-stats" aria-label="公開資料統計">
      <div><strong id="total-count">0</strong><span>篇公開論文</span></div>
      <div><strong id="review-count">0</strong><span>品質評讀</span></div>
      <div><strong id="digest-count">0</strong><span>全文評讀</span></div>
    </section>

    <section class="paper-controls" aria-label="搜尋與篩選">
      <label class="paper-search">
        <span>搜尋論文與閱讀成果</span>
        <input id="query" type="search" placeholder="標題、作者、期刊、DOI、摘要或筆記內容，中英文主題詞會互相展開" autocomplete="off">
      </label>
      <div class="paper-filters" role="group" aria-label="成果類型">
        <button type="button" class="active" data-kind="all">全部</button>
        <button type="button" data-kind="review">品質評讀</button>
        <button type="button" data-kind="digest">全文評讀</button>
      </div>
      <p id="status" class="paper-status" role="status">正在讀取公開資料</p>
    </section>

    <section id="paper-list" class="paper-list" aria-live="polite"></section>
    <nav id="pagination" class="paper-pagination" aria-label="論文頁碼"></nav>
    <section class="section contact-band"><div><p class="eyebrow">Contact</p><h2>合作洽詢</h2><p>營養諮詢、課程、講座、內容合作與衛教工具開發。</p></div><div class="actions"><a class="btn primary" href="https://lin.ee/uGHIQcH" target="_blank" rel="noopener">官方 Line</a><a class="btn" href="mailto:594katchang@gmail.com">Email</a></div></section>
