<main class="paper-radar-page">
<section aria-labelledby="page-title" class="paper-hero">
<div>
<p class="eyebrow">PUBLIC PAPER RADAR</p>
<h1 id="page-title">論文讀書小站</h1>
<p class="lead">保留論文原文的英文題名、作者與摘要，將完成後的閱讀筆記與複習內容放在下方，以繁體中文呈現。</p>
<p class="paper-hero-note">公開頁只放核准的論文欄位與成果，不連接私人網站，不提供排程、上傳或寫入功能。</p>
</div>
<aside aria-label="資料說明" class="paper-hero-panel">
<span class="panel-label">公開資料</span>
<strong id="updated-at">讀取中</strong>
<span>由完成成果的公開白名單產生</span>
</aside>
</section>
<section aria-label="公開資料統計" class="paper-stats">
<div><strong id="total-count">0</strong><span>篇公開論文</span></div>
<div><strong id="review-count">0</strong><span>品質評讀</span></div>
<div><strong id="digest-count">0</strong><span>全文評讀</span></div>
</section>
<section aria-label="搜尋與篩選" class="paper-controls">
<label class="paper-search">
<span>搜尋論文與閱讀成果</span>
<input autocomplete="off" id="query" placeholder="標題、作者、期刊、DOI、摘要或筆記內容，中英文主題詞會互相展開" type="search"/>
</label>
<div aria-label="成果類型" class="paper-filters" role="group">
<button class="active" data-kind="all" type="button">全部</button>
<button data-kind="review" type="button">品質評讀</button>
<button data-kind="digest" type="button">全文評讀</button>
</div>
<p class="paper-status" id="status" role="status">正在讀取公開資料</p>
</section>
<section aria-live="polite" class="paper-list" id="paper-list"></section>
<nav aria-label="論文頁碼" class="paper-pagination" id="pagination"></nav>
