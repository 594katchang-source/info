<script>
const cards=[{"id": 1, "plant": "薰衣草", "theme": "安定", "desc": "當心裡太吵，先別急著把一切想清楚。給自己一點安靜，讓呼吸帶你慢慢回來。", "question": "你現在最需要降低的是哪一種噪音，是外在的，還是心裡的？", "practice": "做三次慢吸慢吐，吸四拍，吐六拍。", "img": "assets/01-lavender.webp"}, {"id": 2, "plant": "洋甘菊", "theme": "放鬆", "desc": "你已經撐了很久，身體也知道。先讓肩膀和眉心鬆一點，休息可以從一個小地方開始。", "question": "你最近有多久，沒有真正放鬆下來？", "practice": "閉上眼 20 秒，掃過額頭、下巴、肩膀，找到一個最緊的地方，輕輕鬆開。", "img": "assets/02-chamomile.webp"}, {"id": 3, "plant": "茉莉", "theme": "安撫", "desc": "脆弱的時候，不用急著把自己藏起來。先陪著這份不太穩的感受，心會慢慢靜下來。", "question": "你現在最需要被理解的是哪一種感受？", "practice": "把手放在胸口，對自己說一句「我有聽見你」。", "img": "assets/03-jasmine.webp"}, {"id": 4, "plant": "玫瑰", "theme": "自我善待", "desc": "你對別人很溫柔，也留一點溫柔給自己吧。照顧自己，是很日常的練習。", "question": "你今天有沒有用太嚴格的方式對自己說話？", "practice": "寫下一句你想送給自己的話。", "img": "assets/04-rose.webp"}, {"id": 5, "plant": "檸檬香蜂草", "theme": "緩和", "desc": "心裡緊的時候，先不用逼自己立刻改變。把速度放慢一點，情緒才有空間落下來。", "question": "你現在最想緩下來的是哪件事？", "practice": "坐好，吸氣時默數 1 到 4，吐氣時默數 1 到 6，做五輪。", "img": "assets/05-lemon-balm.webp"}, {"id": 6, "plant": "尤加利", "theme": "呼吸", "desc": "當胸口悶住，世界也會跟著縮小。把注意力帶回呼吸，讓身體幫你打開一點空間。", "question": "你最近哪一刻最需要一口深呼吸？", "practice": "做三次深吸氣，再把氣慢慢吐長。", "img": "assets/06-eucalyptus.webp"}, {"id": 7, "plant": "桂花", "theme": "溫暖", "desc": "有些安定不是安靜，是心裡重新有了溫度。回想一個讓你覺得被照顧的片刻，讓自己待一下。", "question": "你最近一次感到被溫柔對待，是什麼時候？", "practice": "想一個讓你安心的人、地方或畫面，停留 30 秒。", "img": "assets/07-osmanthus.webp"}, {"id": 8, "plant": "白鶴芋", "theme": "安靜", "desc": "不是每件事都要立刻回應。安靜一下，常常也是一種整理。", "question": "你有哪件事，今天可以先不急著回答？", "practice": "給自己 1 分鐘安靜時間，不滑手機，只留意呼吸。", "img": "assets/08-peace-lily.webp"}, {"id": 9, "plant": "苔蘚", "theme": "慢下來", "desc": "慢，不代表落後。慢，是讓你真正感覺到自己還在這裡。", "question": "你今天最想放慢的是哪一個步驟？", "practice": "把手邊的一件小事故意慢慢做完，例如倒水或洗杯子。", "img": "assets/09-moss.webp"}, {"id": 10, "plant": "蕨類", "theme": "休息", "desc": "休息不是偷懶，是把自己放回可以繼續生活的位置。你可以先停一下。", "question": "你的累，比較像身體累，還是心累？", "practice": "幫自己安排 10 分鐘不被打擾的空白時間。", "img": "assets/10-fern.webp"}, {"id": 11, "plant": "雪松", "theme": "扎根", "desc": "覺得心情很飄的時候，先回到腳下。穩住身體，心也會跟著穩一點。", "question": "什麼會讓你有「站穩了」的感覺？", "practice": "用你的雙腳踩地 30 秒，感受腳底和地面的接觸。", "img": "assets/11-cedar.webp"}, {"id": 12, "plant": "蓮花", "theme": "接納", "desc": "有些感受不需要立刻趕走。先允許它存在，心會少一點拉扯。", "question": "你現在最不想承認，卻一直在心裡的感受是什麼？", "practice": "對那個感受說一句「我知道你在」。", "img": "assets/12-lotus.webp"}, {"id": 13, "plant": "迷迭香", "theme": "清晰", "desc": "當思緒糾結在一起，先別逼自己立刻決定。把混亂攤開來看，答案會慢慢浮出來。", "question": "眼前這件事，真正重要的是哪一部分？", "practice": "把你現在在想的事寫成三句話，接著，只留下最關鍵的一句。", "img": "assets/13-rosemary.webp"}, {"id": 14, "plant": "薄荷", "theme": "釋放", "desc": "悶住太久，心會越來越重。先透一口氣，讓卡住的地方鬆一點。", "question": "你現在最想放下的是什麼？", "practice": "吐氣時想像把胸口那股悶悶的感覺送出去，重複五次。", "img": "assets/14-mint.webp"}, {"id": 15, "plant": "鼠尾草", "theme": "整理", "desc": "腦袋太滿的時候，不用硬撐。先把事情分一分，心會輕一點。", "question": "你現在最需要整理的是情緒、事情，還是關係？", "practice": "寫下三件掛在心上的事，圈出一件今天能處理、能有進度的。", "img": "assets/15-sage.webp"}, {"id": 16, "plant": "羅勒", "theme": "回到當下", "desc": "當心一直往前跑，人就容易不留意現在。把注意力拉回此刻，很多事會沒那麼亂。", "question": "你今天有哪一刻，人在這裡，心卻不在這裡？", "practice": "說出你現在看見的 3 樣東西、聽見的 2 個聲音、感覺到的 1 個身體感受。", "img": "assets/16-basil.webp"}, {"id": 17, "plant": "百里香", "theme": "提振", "desc": "低迷的時候，不用逼自己振作。先點亮一個小小的動力就夠了。", "question": "你今天最需要被喚醒的是精神、信心，還是行動力？", "practice": "選一件只要 5 分鐘就能完成的小事，現在去做。", "img": "assets/17-thyme.webp"}, {"id": 18, "plant": "檸檬", "theme": "明亮", "desc": "當心情灰灰的，先別急著質疑自己。試著把視線移向一點點亮處，哪怕很小也可以。", "question": "今天有沒有一件小事，讓你覺得還不錯？", "practice": "寫下今天 3 個小小的好事。", "img": "assets/18-lemon.webp"}, {"id": 19, "plant": "香茅", "theme": "清新", "desc": "當心被舊情緒黏住，換一口新氣，會有不同的感覺。你可以替今天開啟一個比較清爽的起點。", "question": "你想替今天清掉的是哪一種心情殘留？", "practice": "站起來伸展雙手和肩膀 30 秒，像在把悶氣甩開。", "img": "assets/19-lemongrass.webp"}, {"id": 20, "plant": "竹", "theme": "韌性", "desc": "柔軟不代表脆弱。能彎、能調整，也是一種很有力量的樣子。", "question": "最近哪件事，讓你發現自己其實比想像中更能撐？", "practice": "想起一件你曾經走過的難題，寫下那時你靠什麼撐過來。", "img": "assets/20-bamboo.webp"}, {"id": 21, "plant": "常春藤", "theme": "連結", "desc": "人在累的時候，常會想把自己關起來。其實一句問候、一個陪伴，就能讓心鬆很多。", "question": "你現在最想靠近誰，或最想被誰接住？", "practice": "傳一則簡短訊息給一個讓你安心的人。", "img": "assets/21-ivy.webp"}, {"id": 22, "plant": "橄欖", "theme": "和解", "desc": "有些情緒耗損來自心裡一直在拉扯。放下輸贏，先回到你真正想守住的東西。", "question": "你現在最想和解的是誰，或是你自己的哪一面？", "practice": "寫下一句「我願意先放下的是……」。", "img": "assets/22-olive.webp"}, {"id": 23, "plant": "松樹", "theme": "堅定", "desc": "外面很亂的時候，心裡更需要一個堅定立場。你可以慢慢想清楚，什麼是你真正在乎的。", "question": "眼前這件事，你最想守住的是什麼？", "practice": "寫下一句你的界線宣言，例如「我需要先照顧好自己」。", "img": "assets/23-pine.webp"}, {"id": 24, "plant": "多肉", "theme": "節制", "desc": "照顧自己，有時是加一點，有時是少一點。少承接一點、多留白一點，也是一種保護。", "question": "你最近是不是答應了太多事？", "practice": "找一件今天可以婉拒、延後或簡化的事。", "img": "assets/24-succulent.webp"}, {"id": 25, "plant": "金盞花", "theme": "修復", "desc": "修復不是一下就能好，是一點一點長回來。給自己多點時間，也給自己耐心。", "question": "你現在最需要修補的是身體、情緒，還是生活節奏？", "practice": "寫下一個今天能做到的照顧行動，例如早睡 30 分鐘。", "img": "assets/25-calendula.webp"}, {"id": 26, "plant": "向日葵", "theme": "希望", "desc": "有些美好的事物不會立刻發光發亮。替自己留一個往光走的小方向，就很夠了。", "question": "你現在還願意相信的一件事是什麼？", "practice": "寫下一個這週想靠近的小目標。", "img": "assets/26-sunflower.webp"}, {"id": 27, "plant": "菊花", "theme": "沉澱", "desc": "情緒翻湧時，先不用急著講清楚。讓心沉澱一下，這些想說的話會更貼近自己。", "question": "你現在最需要沉一下的是哪種情緒？", "practice": "倒一杯溫水，慢慢喝完，只留意水流進身體的感覺。", "img": "assets/27-chrysanthemum.webp"}, {"id": 28, "plant": "玉蘭花", "theme": "柔軟", "desc": "你可以堅強，也可以柔軟。很多時候，真正讓人舒服的，是不用一直撐著。", "question": "你最近在哪個時候，很想放下硬撐的樣子？", "practice": "對自己說一句「我可以不用一直撐」。", "img": "assets/28-magnolia.webp"}, {"id": 29, "plant": "天竺葵", "theme": "平衡", "desc": "當生活一頭重、一頭輕，心也會跟著歪。先看看自己的生活，哪個地方需要被拉回來。", "question": "你現在失衡的，是工作與休息、人際與獨處，還是照顧別人與照顧自己？", "practice": "在紙上畫兩欄，寫下「消耗我的」和「滋養我的」。", "img": "assets/29-geranium.webp"}, {"id": 30, "plant": "洛神花", "theme": "回暖", "desc": "冷掉的不只是身體，有時也有心。找回一點熱度，情緒就會開始往炙熱的情緒流動。", "question": "最近什麼事讓你覺得心變冷了？", "practice": "泡一杯熱飲，慢慢喝，只做享受熱飲這一件事。", "img": "assets/30-roselle.webp"}, {"id": 31, "plant": "橙花", "theme": "安心", "desc": "安心不是什麼事都沒發生，是你知道自己可以陪自己走一段。這份感覺，可以慢慢長出來。", "question": "什麼會讓你有被安住的感覺？", "practice": "列出 3 件能讓你安心的小習慣。", "img": "assets/31-orange-blossom.webp"}, {"id": 32, "plant": "茶樹", "theme": "回神", "desc": "當心很散、腦很累，先不用逼自己馬上專注。讓自己休息後再回神，比硬撐更有效。", "question": "你現在最需要回來的是精神、體力，還是注意力？", "practice": "離開座位 1 分鐘，洗把臉或看看遠方。", "img": "assets/32-tea-tree.webp"}, {"id": 33, "plant": "肉桂", "theme": "安穩", "desc": "安穩的感覺常藏在熟悉的小事裡。重複那些讓你安心的節奏，會把自己慢慢帶回來。", "question": "你有哪些日常習慣，會讓心比較穩？", "practice": "做一個熟悉的小儀式，例如泡茶、整理桌面、摺衣服。", "img": "assets/33-cinnamon.webp"}, {"id": 34, "plant": "生薑", "theme": "暖身", "desc": "當你覺得無力感，先別急著責怪自己或他人。讓身體暖一點，人比較容易慢慢恢復。", "question": "你最近的疲憊，是不是已經累到身體裡了？", "practice": "起身走 3 分鐘，讓身體熱起來。", "img": "assets/34-ginger.webp"}, {"id": 35, "plant": "黃金葛", "theme": "陪伴", "desc": "有些支持很安靜，卻一直都在。想起那些默默陪伴你的人事物，心會鬆一點。", "question": "你生命裡，有哪些陪伴是你平常容易忽略的？", "practice": "寫下 3 個讓你覺得有被陪著的存在。", "img": "assets/35-pothos.webp"}, {"id": 36, "plant": "龜背芋", "theme": "展開", "desc": "把心打開，不用一下子所有情緒都放進來。多給自己一點空間，看見新的可能就好。", "question": "你現在最想為自己打開的是哪一扇門？", "practice": "寫下一個你想嘗試的新選擇，哪怕只是很小的一步。", "img": "assets/36-monstera.webp"}];
const grid=document.getElementById('grid'),q=document.getElementById('q'),count=document.getElementById('count'),modal=document.getElementById('modal'),viewer=document.getElementById('viewer');
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function back(c,big=false){return `<div class="card ${big?'big':''}"><img class="cardimg" src="${c.img}" alt="${esc(c.plant)}卡牌圖片"><div class="num">${c.id}</div><div class="name">${esc(c.plant)}</div></div>`}
function render(list){grid.innerHTML=list.map(c=>`<button class="cardbtn" type="button" data-id="${c.id}" aria-label="${esc(c.plant)}｜${esc(c.theme)}">${back(c)}</button>`).join('');count.textContent=`${list.length} / 36`}
function openCard(id){const c=cards.find(x=>x.id===id);viewer.innerHTML=`<div class="big">${back(c,true)}</div><section class="panel"><button class="close" aria-label="關閉">×</button><div class="front"><h2 class="title">${esc(c.plant)}｜${esc(c.theme)}</h2><p class="desc">${esc(c.desc)}</p><div class="qa"><div class="box"><h3>問題</h3><p>${esc(c.question)}</p></div><div class="box"><h3>練習</h3><p>${esc(c.practice)}</p></div></div></div></section>`;modal.classList.add('open');document.body.style.overflow='hidden';if(window.KatAnalytics)window.KatAnalytics.trackEmotionCardFlip(c.id,c.plant,c.theme)}
function closeCard(){modal.classList.remove('open');document.body.style.overflow=''}
grid.onclick=e=>{const b=e.target.closest('.cardbtn');if(b)openCard(Number(b.dataset.id))};q.oninput=()=>{const s=q.value.trim();render(cards.filter(c=>!s||String(c.id).includes(s)||c.plant.includes(s)||c.theme.includes(s)))};modal.onclick=e=>{if(e.target===modal||e.target.className==='close')closeCard()};document.onkeydown=e=>{if(e.key==='Escape')closeCard()};render(cards);
</script>
<script src="../../assets/analytics.js"></script>
</body>
</html>
